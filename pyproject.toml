[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "retry-claim-audit"
version = "0.1.0"
description = "Offline audit of documented retry claims against Python source."
requires-python = ">=3.9"
license = {text = "MIT"}
readme = "README.md"
dependencies = []

[project.scripts]
retry-claim-audit = "retry_claim_audit.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
